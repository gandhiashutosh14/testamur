[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "testamur"
version = "0.5.0"
description = "Verifying creditors' claims in India's corporate insolvency process: read messy claim documents, match them to the right creditor, check them at the cheapest tier that can decide, and never say PASS without evidence."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ashutosh Gandhi" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "pypdf>=4",
    "pypdfium2>=4",
    "pillow>=10",
    "numpy>=1.26",
    "rapidfuzz>=3",
    "bm25s>=0.2",
    "reportlab>=4",
    "alembic>=1.13",
    "opentelemetry-api>=1.27",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.4", "onnxruntime>=1.17", "opencv-python-headless>=4.9"]
local-llm = ["llama-cpp-python>=0.3"]
agents = ["mcp>=2.3,<3", "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4"]
postgres = ["psycopg[binary]>=3.2", "langgraph-checkpoint-postgres>=3.2,<4"]
# RAGAS 0.4.3 imports a module langchain-community dropped after 0.4.1: pinned together, as released
eval = ["ragas==0.4.3", "langchain-community==0.4.1", "fastembed>=0.7,<1"]
service = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "itsdangerous>=2.1",
           "httpx>=0.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27", "boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
testamur = "testamur.cli:app"

[project.urls]
Homepage = "https://github.com/gandhiashutosh14/testamur"

[tool.setuptools.packages.find]
include = ["testamur*"]

[tool.setuptools.package-data]
testamur = ["packs/*/*.yaml", "migrations/script.py.mako", "migrations/versions/*.py", "service/templates/*.html",
            "service/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's and Typer's parameter markers are declarations, evaluated once by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "typer.Option"]
