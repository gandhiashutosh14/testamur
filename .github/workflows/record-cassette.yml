name: record-cassette

# Runs the model tier live on the CI platform with an open-weight model on CPU and records every call, so the
# harness job can replay them exactly. Manual: it downloads a 2.5 GB model and takes about an hour.

on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: Hugging Face repository of the GGUF model
        default: unsloth/Qwen3-4B-Instruct-2507-GGUF
      model_file:
        description: GGUF file name
        default: Qwen3-4B-Instruct-2507-Q4_K_M.gguf

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODEL_REPO: ${{ inputs.model_repo }}
      MODEL_FILE: ${{ inputs.model_file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[ocr]"
      - run: python -m pip install "llama-cpp-python>=0.3" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: gguf-${{ inputs.model_file }}
      - name: Download the model
        run: |
          case "$MODEL_FILE$MODEL_REPO" in *[!A-Za-z0-9._/-]*) echo "unexpected characters in the inputs"; exit 1;; esac
          mkdir -p models
          [ -f "models/$MODEL_FILE" ] || curl -sSL -o "models/$MODEL_FILE" \
            "https://huggingface.co/$MODEL_REPO/resolve/main/$MODEL_FILE"
          ls -la models
      - run: testamur world --seed 7 --size small --out data/world
      - name: Run the harness live and record every model call
        run: |
          testamur harness --world data/world --db data/harness.db --report artifacts/harness-small-live.md \
            --model-path "models/$MODEL_FILE" --cassette artifacts/small-seed7-linux.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cassette-and-live-report
          path: artifacts/
