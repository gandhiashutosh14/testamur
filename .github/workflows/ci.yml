name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests, lint and the proof that safety tests fire (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,ocr,agents,service]"
      - run: ruff check testamur tests scripts
      - name: Tests (a skipped test fails the run unless allow-listed; so does a suite smaller than its floor)
        run: pytest -q
      - name: Break each safety rule on purpose; the tests must go red every time
        run: python scripts/prove_tests_fire.py

  harness:
    name: offline harness and merge gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[ocr]"
      - name: Generate the world (seed 7, small)
        run: testamur world --seed 7 --size small --out data/world
      - name: Run the engine over it and enforce the gates
        run: |
          set -o pipefail
          MODEL=()
          if [ -f reports/cassettes/small-seed7-linux.jsonl ]; then
            MODEL=(--cassette reports/cassettes/small-seed7-linux.jsonl)   # replay-only: a miss fails the job
          fi
          testamur harness --world data/world --db data/harness.db --report artifacts/harness-small.md "${MODEL[@]}"
      - name: The assistant's golden set on the same database
        run: testamur golden --world data/world --db data/harness.db --report artifacts/assistant-golden.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: harness-small
          path: artifacts/

  postgres:
    name: the queue, tenancy and engine on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_HOST_AUTH_METHOD: trust     # a throwaway server for this job only
          POSTGRES_DB: testamur
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TESTAMUR_PG_URL: postgresql+psycopg://postgres@localhost:5432/testamur
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,ocr,postgres]"
      - name: Leases with FOR UPDATE SKIP LOCKED, advisory locks per tenant, tenant isolation, the same statuses
        run: pytest -q tests/test_jobs.py tests/test_tenancy.py tests/test_postgres.py tests/test_migrations.py

  workflows:
    name: the pipeline's own security and correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install "zizmor==1.26.1" "actionlint-py==1.7.10.24"
      - run: zizmor --offline .github/workflows
      - run: actionlint .github/workflows/*.yml

  holdout:
    name: the agents' holdout comparison, replayed from its recording
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[ocr,agents]"
      - name: Every case's output as committed, the agents answered from the recording (a call it lacks fails)
        run: |
          # the four shards the recording was made in: a shard's database holds its own cases' documents, whose
          # ids are in the agents' prompts
          for i in 0 1 2 3; do
            testamur evaluate run --shard "$i/4" --cassette reports/cassettes/holdout.jsonl \
              --out "artifacts/holdout-replay-$i.json"
          done
          testamur evaluate check artifacts/holdout-replay-0.json artifacts/holdout-replay-1.json \
            artifacts/holdout-replay-2.json artifacts/holdout-replay-3.json --against reports/holdout-eval.json

  stack:
    name: the demo stack end to end (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start Postgres, the object store, Jaeger, the migrations, the API and the worker
        run: docker compose up --build --detach --wait api worker
      - name: Seed a synthetic world through the intake, then upload, read, investigate, isolate and trace
        run: |
          set -o pipefail
          docker compose run --rm seed | tee seed.log
          key() { sed -n "s/.*$1: //p" seed.log; }
          python3 scripts/smoke_stack.py --reviewer "$(key 'firm 1 (demo-reviewer)')" \
            --uploader "$(key 'firm 1 (demo-uploader)')" --other-firm "$(key 'firm 2 (demo-reviewer-firm-2)')"
      - name: The services' logs
        if: always()
        run: docker compose logs --no-color --tail 300
      - run: docker compose down --volumes
        if: always()

  gate:
    # The one check branch protection should require. A job that was skipped reports success to required checks;
    # this one runs always and passes only if every job above actually succeeded.
    name: gate
    if: always()
    needs: [test, harness, postgres, holdout, stack, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
