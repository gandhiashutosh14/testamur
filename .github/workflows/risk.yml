name: risk

# Labels each pull request by what it touches, and holds a high-risk one until a person has approved it (and keeps it
# out of auto-merge). The classifier runs from the base branch, so a pull request cannot change the rules it is
# judged by. See scripts/risk.py.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, auto_merge_enabled]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  risk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Classify, label, and hold a high-risk change for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD"
          python scripts/risk.py --base "$BASE" --head "$HEAD" --pr "$PR"
