# Domain pack: supplier assurance.
#
# Everything domain-specific lives here, not in code: what kinds of document exist and how to recognise them,
# which fields to read, which requirements apply to which engagements, and which checks decide each requirement.
# The engine reads this file; a different domain would be a different pack.

name: supplier_assurance
version: 1

# Minimum general-liability cover by supplier risk tier (EUR).
tier_minimum_liability:
  critical: 10000000
  high: 5000000
  standard: 2000000
  low: 1000000

# Certification bodies whose certificates are accepted (an allow-list, compared by name).
accredited_bodies:
  - Meridian Certification Services
  - Northstar Assurance Registrar
  - Calder Quality Institute

doc_types:
  insurance_certificate:
    title_keywords: ["certificate of insurance", "evidence of insurance", "insurance certificate", "confirmation of cover"]
    filename_aliases: ["coi", "insurance", "liability", "cover"]
    key_labels: ["insurer", "policy number", "insured", "general liability limit", "expiry date"]
    fields:
      insurer: {labels: ["insurer"], type: text}
      policy_number: {labels: ["policy number", "policy no"], type: text}
      insured_name: {labels: ["named insured", "insured", "policyholder"], type: text}
      insured_address: {labels: ["registered address", "address of insured"], type: text}
      gl_limit: {labels: ["general liability limit", "public liability limit", "limit of indemnity"], type: money}
      effective_date: {labels: ["effective date", "period from", "inception date"], type: date}
      expiry_date: {labels: ["expiry date", "expiration date", "period to"], type: date}
      issue_date: {labels: ["date of issue", "issued on"], type: date}
      covered_entities: {labels: ["subsidiaries covered", "additional insureds"], type: list}
  security_certificate:
    title_keywords: ["certificate of registration", "certificate of certification", "management system certificate"]
    filename_aliases: ["iso", "27001", "security cert", "isms", "certification"]
    key_labels: ["organisation", "certificate number", "scope", "certification body", "valid until"]
    fields:
      organisation: {labels: ["organisation", "organization", "certified organisation"], type: text}
      certificate_number: {labels: ["certificate number", "certificate no"], type: text}
      standard: {labels: ["standard"], type: text}
      scope: {labels: ["scope"], type: text}
      certification_body: {labels: ["certification body", "issued by"], type: text}
      issue_date: {labels: ["date of issue", "original certification date"], type: date}
      expiry_date: {labels: ["valid until", "expiry date"], type: date}
  bank_letter:
    title_keywords: ["bank account confirmation", "confirmation of bank details", "bank details letter"]
    filename_aliases: ["bank", "account", "payment details"]
    key_labels: ["account holder", "iban", "bic", "bank"]
    fields:
      bank_name: {labels: ["bank"], type: text}
      account_holder: {labels: ["account holder", "account name"], type: text}
      iban: {labels: ["iban"], type: text}
      bic: {labels: ["bic", "swift"], type: text}
      letter_date: {labels: ["date"], type: date}
  tax_registration:
    title_keywords: ["supplier tax registration", "tax registration form", "vat registration details"]
    filename_aliases: ["tax", "vat", "registration form"]
    key_labels: ["legal name", "vat number", "company number"]
    fields:
      legal_name: {labels: ["legal name", "registered name"], type: text}
      vat_number: {labels: ["vat number", "vat registration number"], type: text}
      company_number: {labels: ["company number", "registration number"], type: text}
      lei: {labels: ["lei", "legal entity identifier"], type: text}
      address: {labels: ["registered office", "address"], type: text}
      signed_date: {labels: ["date signed", "signed on"], type: date}
  master_agreement:
    title_keywords: ["master services agreement", "master supply agreement", "framework agreement"]
    filename_aliases: ["msa", "agreement", "contract", "signed"]
    key_labels: ["between", "parties", "governing law"]
    fields:
      supplier_party: {labels: ["supplier"], type: text}
      effective_date: {labels: ["effective date", "commencement date"], type: date}
      supplier_signatory: {labels: ["signed for the supplier", "for and on behalf of the supplier"], type: text}
      customer_signatory: {labels: ["signed for the customer", "for and on behalf of the customer"], type: text}

# Checks. Each names its tier (the cheapest that can decide it), its severity, the rule that evaluates it and a fix
# hint shown with a FAIL. Model-tier checks state a claim, its opposite, and the words to search for.
checks:
  received_before_start:
    tier: metadata
    severity: minor
    rule: uploaded_before_engagement_start
    hint: "Collect this evidence before the engagement starts; it arrived {days_late} days after {start_date}."
  bank_channel_verified:
    tier: metadata
    severity: critical
    rule: channel_in
    params: {allowed: [staff_verified]}
    hint: "Bank details must be confirmed by a call-back to a known number before first payment; this letter arrived via {channel}."
  ins_name_matches:
    tier: field
    severity: critical
    rule: name_matches
    params: {field: insured_name, against: insured_party, pass_at: 92, fail_below: 80}
    hint: "The certificate names '{found}', not '{expected}'. Ask {supplier} for a certificate issued to its legal entity."
  ins_limit_meets_tier:
    tier: field
    severity: critical
    rule: money_at_least
    params: {field: gl_limit, against: tier_minimum_liability}
    hint: "Cover is {found}; a {tier} supplier needs at least {required}. Ask {supplier} to raise the limit."
  ins_cover_current:
    tier: field
    severity: critical
    rule: date_covers
    params: {field: expiry_date, until: as_of, margin_days: 0}
    hint: "Cover lapsed on {found}. Request the renewed certificate from {supplier} now."
  ins_renewal_due:
    tier: field
    severity: minor
    rule: date_covers
    params: {field: expiry_date, until: as_of, margin_days: 30}
    hint: "Cover ends {found}, within 30 days. Ask {supplier} for the renewal certificate before it lapses."
  ins_issued_recently:
    tier: field
    severity: minor
    rule: within_days
    params: {field: issue_date, days: 400}
    hint: "The certificate was issued {found}; ask for a current one."
  sec_org_matches:
    tier: field
    severity: critical
    rule: name_matches
    params: {field: organisation, against: supplier_legal_name, pass_at: 92, fail_below: 80}
    hint: "The certificate is for '{found}', not '{expected}'."
  sec_not_expired:
    tier: field
    severity: critical
    rule: date_covers
    params: {field: expiry_date, until: as_of, margin_days: 0}
    hint: "The certificate expired on {found}. Request the current certificate from {supplier}."
  sec_body_accredited:
    tier: field
    severity: major
    rule: in_allowlist
    params: {field: certification_body, allowlist: accredited_bodies, pass_at: 92}
    hint: "'{found}' is not an accepted certification body; ask for a certificate from an accredited one."
  sec_scope_covers_service:
    tier: field
    severity: major
    rule: scope_mentions
    params: {field: scope, terms_from: service_category}
    hint: "The certificate's scope does not mention {required}; confirm the certified scope covers the services bought."
  bank_iban_valid:
    tier: field
    severity: critical
    rule: iban_checksum
    params: {field: iban}
    hint: "The IBAN fails its check digits; confirm the account details with {supplier} by call-back."
  bank_iban_on_file:
    tier: field
    severity: critical
    rule: matches_record
    params: {field: iban, record: iban}
    hint: "These bank details differ from the account on file. Changed bank details are the classic payment-fraud pattern: verify the change by call-back before updating."
  bank_holder_matches:
    tier: field
    severity: critical
    rule: name_matches
    params: {field: account_holder, against: supplier_legal_name, pass_at: 92, fail_below: 80}
    hint: "The account is held by '{found}', not '{expected}'. Payment details for a different entity are a fraud signal."
  bank_letter_recent:
    tier: field
    severity: minor
    rule: within_days
    params: {field: letter_date, days: 180}
    hint: "The bank letter is dated {found}; ask for one from the last six months."
  tax_name_matches:
    tier: field
    severity: critical
    rule: name_matches
    params: {field: legal_name, against: supplier_legal_name, pass_at: 92, fail_below: 80}
    hint: "The form names '{found}', not '{expected}'."
  tax_vat_format:
    tier: field
    severity: major
    rule: vat_format
    params: {field: vat_number}
    hint: "The VAT number '{found}' is not in a valid format."
  tax_lei_valid:
    tier: field
    severity: major
    rule: lei_checksum
    params: {field: lei, optional: true}
    hint: "The LEI '{found}' fails its check digits."
  msa_signed:
    tier: field
    severity: critical
    rule: both_signed
    params: {fields: [supplier_signatory, customer_signatory]}
    hint: "The agreement is not signed by both parties; obtain a countersigned copy."
  clause_liability_cap:
    tier: model
    severity: major
    rule: clause_present
    params:
      claim: "The agreement caps or limits the Supplier's total liability to a stated amount or formula."
      counterclaim: "The agreement does not cap the Supplier's total liability."
      search: "limitation of liability total aggregate liability shall not exceed cap"
    hint: "No liability cap found; the agreement should cap the supplier's aggregate liability."
  clause_audit_rights:
    tier: model
    severity: major
    rule: clause_present
    params:
      claim: "The Customer has a right to audit or inspect the Supplier's records, systems or premises."
      counterclaim: "The Customer has no right to audit or inspect the Supplier."
      search: "audit inspect records premises access right to audit"
    hint: "No audit right found; add a right to audit the supplier."
  clause_data_protection:
    tier: model
    severity: critical
    rule: clause_present
    params:
      claim: "The Supplier must process personal data only on the Customer's instructions and must protect it."
      counterclaim: "The agreement does not say how the Supplier must process and protect personal data."
      search: "personal data processing instructions protect data protection processor security measures"
    hint: "No data-protection terms found; a supplier processing personal data needs them before work starts."
  clause_anti_assignment:
    tier: model
    severity: minor
    rule: clause_present
    params:
      claim: "The Supplier may not assign or transfer the agreement without the Customer's consent."
      counterclaim: "The Supplier may assign or transfer the agreement without the Customer's consent."
      search: "assign transfer subcontract consent assignment"
    hint: "No restriction on assignment found."

# Requirements: which document must exist for which engagements, and the checks that decide it.
requirements:
  insurance:
    doc_type: insurance_certificate
    applies_to: {tiers: [critical, high, standard]}
    checks: [received_before_start, ins_name_matches, ins_limit_meets_tier, ins_cover_current, ins_renewal_due, ins_issued_recently]
    group_cover: true          # a parent company's group policy can cover a listed subsidiary
  security_certification:
    doc_type: security_certificate
    applies_to: {engagement_types: [data_processing]}
    checks: [sec_org_matches, sec_not_expired, sec_body_accredited, sec_scope_covers_service]
  bank_details:
    doc_type: bank_letter
    applies_to: {}
    checks: [bank_channel_verified, bank_iban_valid, bank_iban_on_file, bank_holder_matches, bank_letter_recent]
  tax_registration:
    doc_type: tax_registration
    applies_to: {}
    checks: [tax_name_matches, tax_vat_format, tax_lei_valid]
  master_agreement:
    doc_type: master_agreement
    applies_to: {tiers: [critical, high]}
    checks: [msa_signed, clause_liability_cap, clause_audit_rights, clause_data_protection, clause_anti_assignment]
    check_applies:
      clause_data_protection: {engagement_types: [data_processing]}

# Words that show the scope of a certificate covers a service category.
service_terms:
  cloud_hosting: ["hosting", "cloud", "data centre", "infrastructure"]
  payroll_services: ["payroll", "salary", "employee payments"]
  logistics: ["logistics", "transport", "warehousing", "freight"]
  facilities: ["cleaning", "facilities", "maintenance"]
  software_development: ["software", "development", "application"]

# Text that addresses an automated reader rather than a person. Found inside a document, it marks the document as
# hostile: model-tier checks on it abstain and a security finding is raised.
injection_markers:
  - "ignore (all |any )?(previous|prior|above) instructions"
  - "automated (reviewer|review|system|reader|checker)"
  - "(answer|respond|reply) (yes|no|pass|true)\\b"
  - "system prompt"
  - "you are (an|a) (ai|assistant|language model)"
  - "disregard (the|all|any)"
  - "mark (this|the) (document|certificate|check) as (compliant|valid|passed)"

# How much error each severity may carry (the share of the engine's PASS verdicts a person would overturn), the share
# of conclusive verdicts people audit to measure it, and the confidence of the bounds. A critical check with any
# confirmed false PASS is demoted regardless: its PASS stops vouching until a person re-certifies it.
assurance:
  false_pass_budget: {critical: 0.01, major: 0.05, minor: 0.10}
  audit_rate: {critical: 0.10, major: 0.05, minor: 0.02}
  confidence: 0.95

# What a finding turns into. Insurance is chased with the supplier (a task and a reminder, at most one a week); any
# other unmet requirement becomes a follow-up task for the buyer's staff; while insurance or bank details are expired
# or not satisfied, the engagement is on a purchasing hold. Due dates by the engagement's risk tier.
actions:
  chase_requirements: [insurance]
  chase_statuses: [MISSING, EXPIRED, NOT_SATISFIED]
  chase_findings: [ins_renewal_due]
  follow_up_statuses: [MISSING, EXPIRED, NOT_SATISFIED]
  hold_requirements: [insurance, bank_details]
  hold_statuses: [EXPIRED, NOT_SATISFIED]
  notify_cooldown_days: 7
  task_due_days: {critical: 5, high: 10, standard: 15, low: 30}
