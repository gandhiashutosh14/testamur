# The adversarial false-PASS panel. Each case is a page of text built to tempt one rule into a PASS it must not
# give; it goes through the real field reader and the real rule. None may PASS, and each must give the verdict
# listed. Several cases record holes found when the panel was first written (two amounts on one line read as the
# first, template placeholders read as signatures, a scope that names a power only to exclude it); the rules were
# fixed and the cases stay. Add a case whenever a new way to fool a rule is found.
#
# Defaults: creditor "Anvaya Fincorp Ltd" (account 004512345678 at Narmada Commercial Bank, IFSC NRMX0004521); a
# secured working-capital claim, tier high, the corporate debtor's books showing Rs. 12,34,56,000 and a facility of
# Rs. 25 crore; corporate debtor "Pench Valley Polymers Pvt Ltd", insolvency commencement 2026-05-01, public
# announcement 2026-05-03; as-of date 2026-10-01.

- id: principal-beside-interest
  doc_type: claim_form
  check: claim_within_books
  why: two amounts on the line; reading the first would compare the principal and ignore the interest claimed
  lines: ["Total amount of claim: Rs. 12,00,00,000 plus interest of Rs. 34,56,000"]
  expect: ABSTAIN
- id: signature-placeholders
  doc_type: facility_agreement
  check: facility_signed
  why: a template's "N/A" and "to be signed" are not signatures
  lines: ["Signed for the Lender: N/A", "Signed for the Borrower: to be signed"]
  expect: FAIL
- id: bracketed-signature-template
  doc_type: facility_agreement
  check: facility_signed
  why: '"[Name, Title]" is the blank the signer was meant to fill in'
  lines: ["Signed for the Lender: [Name, Title]", "Signed for the Borrower: Name"]
  expect: FAIL
- id: powers-that-exclude-voting
  check: auth_covers_voting
  why: the powers name voting only to exclude it
  lines: ["Powers: To attend meetings of the committee of creditors, excluding voting on any resolution plan"]
  expect: ABSTAIN
- id: powers-save-for-voting
  check: auth_covers_voting
  why: '"save for" is an exclusion too'
  lines: ["Powers: To represent the creditor in every matter save for voting"]
  expect: ABSTAIN
- id: decoy-earlier-validity
  check: auth_current
  why: the only date that looks like a validity belongs to last year's authority
  lines: ["LETTER OF AUTHORITY", "Earlier authority valid until: 31.03.2027", "Financial creditor: Anvaya Fincorp Ltd"]
  expect: ABSTAIN
- id: month-first-date
  check: auth_current
  why: read day-first, 09/30/2026 is not a date; it must not be guessed into one
  lines: ["Valid until: 09/30/2026"]
  expect: ABSTAIN
- id: year-only-validity
  check: auth_current
  why: '"2027" could be any day of that year'
  lines: ["Valid until: 2027"]
  expect: ABSTAIN
- id: impossible-date
  check: auth_current
  why: there is no 31 February
  lines: ["Valid until: 31.02.2027"]
  expect: ABSTAIN
- id: amendment-contradicts-letter
  check: auth_current
  why: page two shortens the period stated on page one
  lines: ["Valid until: 01.06.2027", "AMENDMENT TO THE LETTER OF AUTHORITY", "Valid until: 01.06.2026"]
  expect: ABSTAIN
- id: lapsed-yesterday
  check: auth_current
  why: the authority ended the day before the as-of date
  lines: ["Valid until: 30.09.2026"]
  expect: FAIL
- id: malformed-grouping
  doc_type: claim_form
  check: claim_within_books
  why: OCR read 12,34,56,000 as 12,34,56000; it must not be guessed into a number
  lines: ["Total amount of claim: Rs. 12,34,56000"]
  expect: ABSTAIN
- id: mixed-grouping
  doc_type: claim_form
  check: claim_within_books
  why: 12,345,67,000 mixes thousands and lakh grouping and has no single reading
  lines: ["Total amount of claim: Rs. 12,345,67,000"]
  expect: ABSTAIN
- id: another-currency
  doc_type: claim_form
  check: claim_within_books
  why: there is no conversion rule; a claim in dollars is not compared with rupees in the books
  lines: ["Total amount of claim: USD 1,500,000"]
  expect: ABSTAIN
- id: a-rupee-over-the-tolerance
  doc_type: claim_form
  check: claim_within_books
  why: the books plus two per cent is Rs. 12,59,25,120; the tolerance is a limit
  lines: ["Total amount of claim: Rs. 12,59,25,121"]
  expect: FAIL
- id: lakh-not-crore
  doc_type: charge_certificate
  check: charge_amount_covers
  why: Rs. 25 lakh is not Rs. 25 crore
  lines: ["Amount secured: Rs. 25 lakh"]
  expect: FAIL
- id: words-a-hundredth-of-the-figures
  doc_type: claim_form
  check: claim_words_match
  why: the words say Rs. 12,34,560, the figures a hundred times more
  lines: ["Total amount of claim: Rs. 12,34,56,000",
          "Amount in words: Rupees Twelve Lakh Thirty-Four Thousand Five Hundred Sixty Only"]
  expect: FAIL
- id: words-with-paise
  doc_type: claim_form
  check: claim_words_match
  why: the figures have no paise; words that add some are not read as agreeing
  lines: ["Total amount of claim: Rs. 12,34,56,000",
          "Amount in words: Rupees Twelve Crore Thirty-Four Lakh Fifty-Six Thousand and Fifty Paise Only"]
  expect: ABSTAIN
- id: default-a-day-outside-limitation
  doc_type: claim_form
  check: claim_not_time_barred
  why: three years before 1 May 2026 is 1 May 2023; a default on 30 April 2023 is outside limitation
  lines: ["Date of default: 30.04.2023"]
  expect: FAIL
- id: default-written-month-first
  doc_type: claim_form
  check: claim_not_time_barred
  why: 04/30/2023 is not a day-first date; guessing it would decide limitation on a guess
  lines: ["Date of default: 04/30/2023"]
  expect: ABSTAIN
- id: pan-of-another-entity
  doc_type: claim_form
  check: claim_pan_in_gstin
  why: the GSTIN carries the PAN AAKCA1234K; the form's PAN names someone else
  lines: ["PAN: AAKCA9234K", "GSTIN: 27AAKCA1234K1ZP"]
  expect: FAIL
- id: prefixed-name
  check: auth_creditor_matches
  why: '"Shree" in front makes a different company'
  lines: ["Financial creditor: Shree Anvaya Fincorp Ltd"]
  expect: ABSTAIN
- id: group-name
  check: auth_creditor_matches
  why: the group is not the creditor
  lines: ["Financial creditor: Anvaya Group Ltd"]
  expect: FAIL
- id: charge-over-a-group-company
  doc_type: charge_certificate
  check: charge_on_debtor
  why: a charge created by a sister company secures nothing in the corporate debtor's process
  lines: ["Company: Pench Valley Exports Pvt Ltd"]
  expect: ABSTAIN
- id: registrar-lookalike
  doc_type: charge_certificate
  check: charge_registrar_recognised
  why: '"Registrar of Charges" is not a Registrar of Companies'
  lines: ["Registered by: Registrar of Charges, Western Circle"]
  expect: ABSTAIN
- id: issued-in-the-future
  check: auth_issued_recently
  why: an authority dated after the as-of date is not recent, it is wrong
  lines: ["Date of issue: 15.01.2027"]
  expect: ABSTAIN
- id: ifsc-of-another-bank
  doc_type: bank_mandate
  check: bank_ifsc_valid
  why: the branch code under the letter's bank name belongs to another bank
  lines: ["Bank: Narmada Commercial Bank", "IFSC: DCMX0004521"]
  expect: FAIL
- id: ifsc-with-a-letter-o
  doc_type: bank_mandate
  check: bank_ifsc_valid
  why: the fifth character of an IFSC is always the digit zero
  lines: ["Bank: Narmada Commercial Bank", "IFSC: NRMXO004521"]
  expect: FAIL
- id: valid-account-not-on-file
  doc_type: bank_mandate
  check: bank_account_on_file
  why: one digit away from the account on file is a different account, the payment-fraud pattern
  lines: ["Account number: 0045 1234 5679"]
  expect: FAIL
- id: blank-signature-lines
  doc_type: facility_agreement
  check: facility_signed
  why: lines drawn for signatures are not signatures
  lines: ["Signed for the Lender: ____________", "Signed for the Borrower: ____________"]
  expect: FAIL
