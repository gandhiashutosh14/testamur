  - id: conditional-approval-recorded-on-the-letter
    category: a conditional grant whose condition is met
    creditor: Brightwater Capital Finance Limited
    claim: {tier: standard, type: unsecured, facility: term_loan, books: 182000000, sanctioned: 200000000}
    documents:
      - name: authority-brightwater.pdf
        pages:
          - - [title, LETTER OF AUTHORITY]
            - [kv, Financial creditor, "{creditor}"]
            - [kv, Authorised representative, "Anjali Menon, Senior Manager, Stressed Assets"]
            - [kv, Powers, "To attend meetings of the committee of creditors and to vote on its resolutions, subject to the prior approval of our Board of Directors"]
            - [kv, Effective from, "2026-06-01"]
            - [kv, Valid until, "2027-05-31"]
            - [kv, Date of issue, "2026-05-28"]
            - [para, "Extract of the minutes: at its meeting held on 2 June 2026 the Board of Directors of {creditor} approved the exercise of voting rights by the authorised representative named above in the insolvency process of {debtor} (resolution 14 of 2026)."]
    target: {requirement: authority, check: auth_covers_voting}
    truth: [PASS]
    why: the grant depends on the board's approval, and the same page records the approval, its date and its number.

