# Holdout cases for the comparison of the rules alone, one agent, and the investigator-verifier pair.
#
# Written by hand for this evaluation, independently of the world generator (testamur/synth): other names, other
# phrasing, other layouts, and situations the generator does not produce. Each case is one claim with the documents
# it files and one target: a check (or a requirement's status) with the outputs that are correct for it.
#
#   truth: the outputs that are right. PASS or FAIL is a verdict; person means the documents alone cannot settle it
#          and a person must look. A list admits more than one (a lapsed power is FAIL, and sending it to a person is
#          also right). An output outside the list is wrong; PASS outside it is a false PASS.
#
# Fixed before any agent ran on it: the report states this file's digest, and changing a label is a new version of
# the set, recorded in its history, never an edit to make a number better. Every name is fictional.

